databaseChangeLog:
  - changeSet:
      id: create-1
      author: moles
      comment: create company
      changes:
        - createTable:
            tableName: company
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
  - changeSet:
      id: create-2
      author: moles
      comment: company add column parentId
      changes:
        - addColumn:
            tableName: company
            columns:
              - column:
                  name: parent_id
                  type: int
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: company
            baseColumnNames: parent_id
            referencedTableName: company
            referencedColumnNames: id
            constraintName: fk_company_parent_id